name: mega-sena

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Base de produção-símile: imagem imutável (`Dockerfile` estágio `runtime`),
# gunicorn como servidor WSGI, sem bind mount de código. Migrações e seed de
# dados são aplicados por docker-entrypoint.sh como etapa controlada, antes
# do processo do servidor iniciar — nunca dentro de `create_app()`.
#
# Uso padrão: `docker compose -f compose.yaml up` usa a imagem imutável, sem
# bind mount de código. Desenvolvimento com edição ao vivo exige incluir
# explicitamente `-f compose.dev.yaml`.

services:
  postgres:
    image: postgres:17-alpine
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mega_sena}
      POSTGRES_USER: ${POSTGRES_USER:-mega_sena}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: America/Sao_Paulo
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5102}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mega_sena} -d ${POSTGRES_DB:-mega_sena}"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s

  app:
    # Nome fixo em vez do derivado do diretorio. Sem isto o Compose batiza a
    # imagem a partir do nome da pasta, que muda conforme onde o repositorio
    # foi clonado -- no CI seria um nome, no VPS outro. A varredura de
    # vulnerabilidade precisa apontar para uma imagem por NOME, e nome que
    # depende do caminho do checkout nao serve de alvo.
    image: mega-sena:local
    build:
      context: .
      target: runtime
      secrets:
        - local_ca
        - github_token
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    pids_limit: 256
    mem_limit: 512m
    cpus: "2.0"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-mega_sena}
      DB_USER: ${POSTGRES_USER:-mega_sena}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      SECRET_KEY_FILE: /run/secrets/secret_key
      MEGA_SENA_HOST: 0.0.0.0
      MEGA_SENA_PORT: "5001"
      MEGA_SENA_SESSION_COOKIE_NAME: ${MEGA_SENA_SESSION_COOKIE_NAME:-mega_sena_session}
      MEGA_SENA_TRUSTED_HOSTS: ${MEGA_SENA_TRUSTED_HOSTS:-localhost,127.0.0.1,[::1]}
      MEGA_SENA_TRUST_PROXY_HEADERS: ${MEGA_SENA_TRUST_PROXY_HEADERS:-false}
      MEGA_SENA_FORCE_HTTPS: ${MEGA_SENA_FORCE_HTTPS:-false}
      TZ: America/Sao_Paulo
    secrets:
      - postgres_password
      - secret_key
    ports:
      - "127.0.0.1:${APP_PORT:-5101}:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 60s
    logging: *default-logging

  # Banco EFÊMERO da suíte.
  #
  # Não é o `postgres` de cima, e isso é deliberado: a suíte aplica migrações e
  # grava, e não pode ter caminho até o volume com dados reais nem por engano.
  # Sem volume nomeado -- os dados vivem em tmpfs e somem com o contêiner.
  #
  # `uid=70,gid=70,mode=0700` no tmpfs de dados: ele nasce pertencendo ao root,
  # e o `initdb` roda como `postgres` com `cap_drop: ALL`, sem CAP_CHOWN nem
  # CAP_FOWNER para tomar posse. 70 é o uid do postgres nesta imagem.
  #
  # O `.secrets/postgres_password.txt` precisa ser LEGÍVEL PELO UID 70: um
  # segredo de arquivo é montado preservando dono e modo do host, e `uid`/`gid`/
  # `mode` na sintaxe longa são ignorados fora do Swarm. Com 0600 de outro dono,
  # este contêiner morre no arranque e o `quality` só reporta "dependency failed
  # to start". No Docker Desktop do Windows não aparece: lá tudo chega 0777.
  postgres-teste:
    image: postgres:17-alpine
    profiles: ["quality"]
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
      - /var/lib/postgresql/data:rw,nosuid,nodev,mode=0700,uid=70,gid=70,size=512m
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mega_sena}
      POSTGRES_USER: ${POSTGRES_USER:-mega_sena}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: America/Sao_Paulo
    secrets:
      - postgres_password
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mega_sena} -d ${POSTGRES_DB:-mega_sena}"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Ruff e a suíte mínima de segurança. Fica atrás de um perfil para não subir
  # junto com a aplicação:
  # `docker compose --profile quality run --build --rm quality`.
  # O `--build` é necessário: este serviço não monta o código do host, e
  # `docker compose run` reutiliza a imagem existente sem reconstruí-la.
  quality:
    build:
      context: .
      target: quality
      secrets:
        - local_ca
        - github_token
    # OS NOMES TÊM PREFIXO `TESTE_` DE PROPÓSITO, e não são `POSTGRES_HOST` e
    # companhia: a suíte tem testes que medem o que a aplicação faz quando uma
    # variável NÃO existe, apagando-a com `monkeypatch.delenv`. Declarar os
    # nomes reais aqui faria o app encontrar por arquivo o que o teste acabou
    # de apagar do ambiente. Com prefixo, o ambiente da suíte fica intacto e só
    # a fixture `app_com_banco` enxerga estes valores.
    environment:
      TESTE_POSTGRES_HOST: postgres-teste
      TESTE_POSTGRES_PORT: "5432"
      TESTE_POSTGRES_DB: ${POSTGRES_DB:-mega_sena}
      TESTE_POSTGRES_USER: ${POSTGRES_USER:-mega_sena}
    secrets:
      - postgres_password
    depends_on:
      postgres-teste:
        condition: service_healthy
    profiles: ["quality"]
    cpus: "2.0"

volumes:
  postgres_data:

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
  postgres_password:
    file: .secrets/postgres_password.txt
  secret_key:
    file: .secrets/secret_key.txt
  # PAT de acesso restrito (somente-leitura, só no repositório SharedAuth) --
  # usado apenas durante o build, para o `pip install` do pyproject.toml
  # baixar a dependência Git privada. Nunca vira variável de ambiente do
  # runtime nem fica na imagem final.
  github_token:
    file: .secrets/github_token.txt
