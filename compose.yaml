name: mega-sena

# Base de produção-símile: imagem imutável (`Dockerfile` estágio `runtime`),
# gunicorn como servidor WSGI, sem bind mount de código. Migrações e seed de
# dados são aplicados por docker-entrypoint.sh como etapa controlada, antes
# do processo do servidor iniciar — nunca dentro de `create_app()`.
#
# Uso em desenvolvimento: `docker compose up` já mescla automaticamente
# `compose.override.yaml` (convenção do Docker Compose), trocando para a
# imagem `dev` com bind mount e o servidor de desenvolvimento do Flask.
#
# Uso "produção-símile" (sem overrides de dev): `docker compose -f compose.yaml up`.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mega_sena}
      POSTGRES_USER: ${POSTGRES_USER:-mega_sena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mega_sena_dev_local}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mega_sena} -d ${POSTGRES_DB:-mega_sena}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: runtime
      secrets:
        - local_ca
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mega_sena}:${POSTGRES_PASSWORD:-mega_sena_dev_local}@postgres:5432/${POSTGRES_DB:-mega_sena}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      MEGA_SENA_HOST: 0.0.0.0
      MEGA_SENA_PORT: "5000"
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${APP_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: runtime
      secrets:
        - local_ca
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mega_sena}:${POSTGRES_PASSWORD:-mega_sena_dev_local}@postgres:5432/${POSTGRES_DB:-mega_sena}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      TZ: America/Sao_Paulo
    volumes:
      # Somente a base legada (leitura) e um destino para o relatório de
      # importação — não o código-fonte, que já está embutido na imagem
      # `runtime`. Isto não é o bind mount de desenvolvimento (código
      # editável); é a entrada/saída mínima de uma ferramenta pontual.
      - ./instance:/sqlite:ro
      - .:/report-output
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        flask --app run.py db upgrade &&
        python scripts/migrate_sqlite_to_postgres.py
        --sqlite /sqlite/mega_sena.db
        --confirm-reset-postgres
        --report /report-output/migration_report.json

volumes:
  postgres_data:

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
