<section id="users-table" class="card" aria-live="polite"{% if oob|default(false) %} hx-swap-oob="outerHTML"{% endif %}>
  <div class="panel-header">
    <h2>Usuários</h2>
  </div>
  <table>
    <thead><tr><th>Usuário</th><th>Status</th><th>Redefinir senha</th><th>Acesso</th></tr></thead>
    <tbody>
      {% for usuario in users %}
      <tr>
        <td>{{ usuario.username }}</td>
        <td>{{ 'Ativo' if usuario.is_active_user else 'Inativo' }}</td>
        <td>
          <form method="post" action="{{ url_for('web.reset_user_password', user_id=usuario.id) }}" class="inline-form"
                hx-post="{{ url_for('web.reset_user_password', user_id=usuario.id) }}" hx-target="#users-feedback" hx-swap="outerHTML">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="password" name="password" minlength="{{ min_password_length }}" placeholder="Nova senha" required autocomplete="new-password">
            <button type="submit">Redefinir</button>
          </form>
        </td>
        <td>
          <form method="post" action="{{ url_for('web.toggle_user_active', user_id=usuario.id) }}" class="inline-form"
                hx-post="{{ url_for('web.toggle_user_active', user_id=usuario.id) }}" hx-target="#users-feedback" hx-swap="outerHTML">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="active" value="{{ '0' if usuario.is_active_user else '1' }}">
            {% if usuario.is_active_user %}
            <button type="submit" class="danger" hx-confirm="Desativar '{{ usuario.username }}'?" data-confirm-message="Desativar '{{ usuario.username }}'?">Desativar</button>
            {% else %}
            <button type="submit">Reativar</button>
            {% endif %}
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="empty-state">Nenhum usuário cadastrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
