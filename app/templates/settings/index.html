{% extends "base.html" %}
{% block content %}
<section class="card settings-section">
    <div class="panel-header">
      <h2>Configurações</h2>
    </div>
    <p>Valores padrão usados ao abrir a geração e o racional.</p>
    <form method="post" action="{{ url_for('web.save_settings') }}" class="form-grid settings-grid">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label>Números por aposta<input type="number" name="bet_quantity" min="6" max="15" value="{{ config_values.bet_quantity }}"></label>
        <label>Quantas apostas deseja gerar<input type="number" name="generation_amount" min="1" max="100" value="{{ config_values.generation_amount }}"></label>
        <label>Maior sequência consecutiva permitida<input type="number" name="consecutive_count" min="0" max="6" placeholder="Opcional" value="{{ config_values.consecutive_count }}"></label>
        <label>Mínimo de números pares<input type="number" name="even_min" min="0" max="6" placeholder="Opcional" value="{{ config_values.even_min }}"></label>
        <label>Máximo de números pares<input type="number" name="even_max" min="0" max="6" placeholder="Opcional" value="{{ config_values.even_max }}"></label>
        <label>Soma inicial<input type="number" name="sum_min" min="0" max="345" placeholder="Opcional" value="{{ config_values.sum_min }}"></label>
        <label>Soma final<input type="number" name="sum_max" min="0" max="345" placeholder="Opcional" value="{{ config_values.sum_max }}"></label>
        <label>Mínimo de faixas ocupadas<input type="number" name="range_min_occupied" min="1" max="6" placeholder="Opcional" value="{{ config_values.range_min_occupied }}"></label>
        <label>Máximo de dezenas por faixa<input type="number" name="range_max_per_band" min="1" max="6" placeholder="Opcional" value="{{ config_values.range_max_per_band }}"></label>
        <div class="form-actions">
            <button type="submit">Salvar configurações</button>
        </div>
    </form>
</section>
<section class="card danger-zone">
    <div class="panel-header">
      <h2>Reiniciar base</h2>
    </div>
    <p class="muted">Apaga todos os concursos e apostas salvos. Use isso apenas para começar do zero.</p>
    <form method="post" action="{{ url_for('web.reset_database') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="danger" data-confirm-message="Apagar todos os concursos e apostas? Essa ação não pode ser desfeita.">Apagar concursos e apostas</button>
    </form>
</section>
{% endblock %}
