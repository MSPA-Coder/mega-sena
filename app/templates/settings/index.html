{% extends "base.html" %}
{% block content %}
<section class="card settings-section">
    <div class="panel-header">
      <h2>Configurações</h2>
    </div>
    <p>Valores padrão usados ao abrir a geração, o racional e a importação de resultados.</p>
    <form method="post" action="{{ url_for('web.save_settings') }}" class="form-grid settings-grid"
          hx-post="{{ url_for('web.save_settings') }}" hx-target="#settings-feedback" hx-swap="outerHTML"
          hx-disabled-elt="find button" hx-indicator="#settings-saving">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Números por aposta<input type="number" name="bet_quantity" min="{{ generation_limits['quantity'][0] }}" max="{{ generation_limits['quantity'][1] }}" value="{{ config_values.bet_quantity }}"></label>
        <label>Quantas apostas deseja gerar<input type="number" name="generation_amount" min="{{ generation_limits['amount'][0] }}" max="{{ generation_limits['amount'][1] }}" value="{{ config_values.generation_amount }}"></label>
        <label>Maior sequência consecutiva permitida<input type="number" name="consecutive_count" min="0" max="6" placeholder="Opcional" value="{{ config_values.consecutive_count }}"></label>
        <label>Mínimo de números pares<input type="number" name="even_min" min="0" max="6" placeholder="Opcional" value="{{ config_values.even_min }}"></label>
        <label>Máximo de números pares<input type="number" name="even_max" min="0" max="6" placeholder="Opcional" value="{{ config_values.even_max }}"></label>
        <label>Soma inicial<input type="number" name="sum_min" min="0" max="345" placeholder="Opcional" value="{{ config_values.sum_min }}"></label>
        <label>Soma final<input type="number" name="sum_max" min="0" max="345" placeholder="Opcional" value="{{ config_values.sum_max }}"></label>
        <label>Mínimo de faixas ocupadas<input type="number" name="range_min_occupied" min="1" max="6" placeholder="Opcional" value="{{ config_values.range_min_occupied }}"></label>
        <label>Máximo de dezenas por faixa<input type="number" name="range_max_per_band" min="1" max="6" placeholder="Opcional" value="{{ config_values.range_max_per_band }}"></label>
        <label class="settings-source-url">Link da planilha de resultados<input type="url" name="results_source_url" maxlength="200" value="{{ config_values.results_source_url }}" required></label>
        <div class="form-actions">
            <button type="submit">Salvar configurações</button>
            <span id="settings-saving" class="htmx-indicator" role="status">Salvando…</span>
        </div>
    </form>
    <div id="settings-feedback" aria-live="polite"></div>
</section>
<section class="card danger-zone">
    <div class="panel-header">
      <h2>Reiniciar base</h2>
    </div>
    <p class="muted">Apaga todos os concursos e apostas salvos. Use isso apenas para começar do zero.</p>
    <form method="post" action="{{ url_for('web.reset_database') }}"
          hx-post="{{ url_for('web.reset_database') }}" hx-target="#settings-feedback" hx-swap="outerHTML"
          hx-disabled-elt="find button" hx-indicator="#reset-saving">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="danger" hx-confirm="Apagar todos os concursos e apostas? Essa ação não pode ser desfeita." data-confirm-message="Apagar todos os concursos e apostas? Essa ação não pode ser desfeita.">Apagar concursos e apostas</button>
        <span id="reset-saving" class="htmx-indicator" role="status">Reiniciando…</span>
    </form>
</section>
{% endblock %}
