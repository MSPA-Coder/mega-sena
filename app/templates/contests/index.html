{% extends "base.html" %}
{% block content %}
<section class="card import-card">
  <div class="panel-header"><h2>Importar resultados</h2></div>
  <p class="muted">Selecione uma planilha .xlsx. O arquivo será lido somente para a importação e não será armazenado no projeto.</p>
  <form method="post" action="{{ url_for('web.import_upload') }}" enctype="multipart/form-data" class="form import-form"
        hx-post="{{ url_for('web.import_upload') }}" hx-encoding="multipart/form-data"
        hx-target="#import-feedback" hx-swap="outerHTML" hx-disabled-elt="find button" hx-indicator="#import-indicator">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>Planilha<input type="file" name="file" accept=".xlsx" required></label>
    <button type="submit">Importar</button>
    <span id="import-indicator" class="htmx-indicator" role="status">Importando…</span>
  </form>
  <div id="import-feedback" aria-live="polite"></div>
</section>
{% include "contests/_results.html" %}
{% endblock %}
