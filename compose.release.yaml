# Exclusivo de deploy.sh: referências conferidas antes de alterar serviços.
services:
  app:
    image: ${APP_IMAGE:?deploy.sh deve fornecer APP_IMAGE por ID}
    pull_policy: never
  migrate:
    image: ${APP_IMAGE:?deploy.sh deve fornecer APP_IMAGE por ID}
    pull_policy: never
  postgres:
    image: ${POSTGRES_IMAGE:?deploy.sh deve fornecer POSTGRES_IMAGE por ID}
    pull_policy: never
    # Em produção só o app fala com o banco (o backup usa docker exec).
    ports: !reset []
  db-provision:
    image: ${POSTGRES_IMAGE:?deploy.sh deve fornecer POSTGRES_IMAGE por ID}
    pull_policy: never
