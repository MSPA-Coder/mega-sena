# Metadados e configuracao de ferramentas do MegaSena.
#
# As dependencias vivem aqui, em `[project]`, e nao em `requirements*.txt`:
# uma unica fonte serve ao `pip install .` da imagem e ao `pip install -e
# ".[dev]"` do venv de desenvolvimento. Os cinco projetos irmaos seguem esta
# mesma forma.

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mega-sena"
version = "2.2.0"
description = "Importacao de resultados da Mega-Sena, estatisticas e geracao de apostas."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "Flask>=3.1.3,<4",
  "Flask-Limiter>=3.0,<5",
  "Flask-Login>=0.6.3,<1",
  "Flask-Migrate>=4.1.0,<5",
  "Flask-SQLAlchemy>=3.1.1,<4",
  "Flask-WTF>=1.2.2,<2",
  # Sem import direto: openpyxl detecta e usa defusedxml automaticamente para
  # blindar a leitura de .xlsx contra XML malicioso (bomb/entity expansion).
  "defusedxml>=0.7.1,<1",
  # `--no-control-socket` foi introduzido na familia 25 e evita o servidor de
  # controle no runtime; a faixa precisa refletir a CLI realmente usada.
  "gunicorn>=25.1,<27",
  "openpyxl>=3.1.5,<4",
  "psycopg[binary]>=3.2.9,<4",
  # Sessao, CSRF, rate-limit no login, controle de acesso, hash de senha,
  # cabecalhos de seguranca, formatacao em pt-BR e rota de saude compartilhados
  # com os outros aplicativos do mantenedor. A tag e fixada manualmente e nunca
  # aponta para branch.
  #
  # O extra `[flask]` e obrigatorio: o nucleo do pacote e Python puro e nao
  # instala as integracoes e dependencias Flask.
  "sharedauth[flask] @ git+https://github.com/MSPA-Coder/SharedAuth.git@v0.10.0",
]

[project.optional-dependencies]
# Instaladas apenas no estagio `quality` da imagem e no venv local, nunca no
# `runtime`. A suite exercita a aplicacao real -- cabecalhos, CSRF e
# autenticacao passam pelo cliente de teste do proprio Flask, sem duble --,
# entao estas vem sobre as de execucao, nao no lugar delas.
dev = [
  "ruff>=0.12,<1",
  "pytest>=8.3,<10",
  # Usa o armazenamento de certificados do Windows ao rodar fora do conteiner.
  "truststore>=0.10.4,<1",
  # Auditoria de CVE das dependencias instaladas. Piso na minor atual, teto na
  # proxima major -- politica de faixa do mantenedor.
  "pip-audit>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# `sharedauth` e referencia direta a um repositorio Git (nao a um indice PyPI):
# Hatchling recusa isso por padrao e exige este opt-in explicito.
[tool.hatch.metadata]
allow-direct-references = true

# A secao [tool.ruff] e comum aos projetos irmaos; so `target-version` e
# `known-first-party` variam, porque dependem da versao de Python da imagem e do
# layout de pacotes. Mantenha o resto em sincronia.

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "backups", "instance"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # comprimento de linha: responsabilidade do formatador
]

[tool.ruff.lint.isort]
known-first-party = ["app", "migrations", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
# Migracoes Alembic sao geradas: a ordem de import e as expressoes longas de
# schema vem da ferramenta, e reescreve-las a mao so afasta o arquivo do que
# seria regerado.
"migrations/versions/*.py" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
# Sem isto o pytest coloca `tests/` no sys.path em vez da raiz, e `import app`
# falha dentro do conteiner.
pythonpath = ["."]
