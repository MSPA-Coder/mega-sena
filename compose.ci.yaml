# CI isolada: sem volumes/portas de uso nem rebuild implícito.
services:
  postgres:
    pull_policy: never
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700,size=512m
  db-provision:
    pull_policy: never
  app:
    pull_policy: never
    ports: !reset []
  migrate:
    pull_policy: never
    ports: !reset []
  postgres-teste:
    pull_policy: never
  quality:
    image: mega-sena-quality:ci
    pull_policy: never
