name: mega-browser-tests
services:
  browser-db:
    image: ${BROWSER_POSTGRES_IMAGE:-mspa-postgres:17-alpine}
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: browser_tests
      POSTGRES_USER: browser
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:mode=1777
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700,size=512m
    healthcheck:
      test: [CMD, pg_isready, -U, browser, -d, browser_tests]
      interval: 2s
      timeout: 3s
      retries: 30
  browser-web:
    image: ${BROWSER_APP_IMAGE:-mega-browser-app:local}
    build:
      context: .
      target: runtime
      secrets: [local_ca]
    entrypoint: []
    command: [gunicorn, --bind, "0.0.0.0:5100", --workers, "1", --threads, "4", --no-control-socket, "browser_server:application"]
    volumes:
      - ./tests/browser_server.py:/app/browser_server.py:ro
    environment:
      BROWSER_TEST_SERVER: "1"
      PYTHONPATH: /app
      TZ: America/Sao_Paulo
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    depends_on:
      browser-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5100/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  browser-tests:
    image: mega-browser-runner:local
    build:
      context: .
      dockerfile: Dockerfile.browser
      secrets: [local_ca]
    environment:
      BASE_URL: http://127.0.0.1:5100
    network_mode: service:browser-web
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 512m
    tmpfs: [/tmp]
    volumes:
      - ./.browser-results:/results
    depends_on:
      browser-web:
        condition: service_healthy
secrets:
  local_ca:
    file: ${BROWSER_CA_FILE:-.certs/local-root-ca.crt}
