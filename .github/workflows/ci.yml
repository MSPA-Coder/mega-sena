name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate ephemeral local CA
        run: |
          mkdir -p .certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/mega-sena-ci-ca.key \
            -out .certs/local-root-ca.crt \
            -days 1 \
            -subj "/CN=MegaSena CI Local CA"
          rm -f /tmp/mega-sena-ci-ca.key
      - name: Write SharedAuth read token
        # PAT de acesso restrito, somente-leitura, só no repositório
        # SharedAuth -- usado apenas para o `pip install` do requirements.txt
        # baixar essa dependência privada durante o build da imagem `quality`.
        run: |
          mkdir -p .secrets
          printf '%s' "${{ secrets.SHAREDAUTH_READ_TOKEN }}" > .secrets/github_token.txt
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build quality image without cache
        run: docker compose --profile quality build --no-cache quality
      - name: Run quality checks
        run: docker compose --profile quality run --rm quality

      # O Dependabot abre PR quando sai versao nova. Nao e a mesma pergunta que
      # "a versao que esta instalada AGORA tem CVE conhecido?" -- e essa segunda
      # ninguem fazia em nenhum dos seis repositorios.
      #
      # Roda dentro da propria imagem `quality`, que ja instala exatamente o que
      # a imagem servida instala, mais as ferramentas de teste. Auditar o
      # ambiente instalado responde a pergunta certa; auditar o arquivo de
      # requisitos responderia sobre o que esta ESCRITO, nao sobre o que esta
      # rodando.
      #
      # Reprova em qualquer achado, de proposito. Vulnerabilidade sem correcao
      # publicada sai por `--ignore-vuln ID` com um comentario dizendo por que:
      # cada excecao vira uma decisao explicita e datada, em vez de um vermelho
      # permanente que se aprende a ignorar.
      # `--cache-dir` em /tmp porque HOME e /app na imagem e /app/.cache nao
      # existe: sem isto o pip-audit morre tentando criar o proprio cache,
      # antes de auditar coisa alguma. Mesmo motivo de RUFF_CACHE_DIR e
      # PYTEST_ADDOPTS ja apontarem para /tmp no Dockerfile.
      - name: Auditar dependencias instaladas (CVE conhecido)
        run: docker compose --profile quality run --rm quality pip-audit --progress-spinner=off --cache-dir /tmp/pip-audit-cache

      - name: Construir a imagem servida
        run: docker compose build app

      # O `pip-audit` acima cobre as dependencias Python. Esta varredura cobre o
      # que ele nao ve: os pacotes do sistema operacional da imagem base.
      #
      # RODA COMO CONTEINER, NAO COMO ACTION. A politica de Actions deste
      # repositorio e `selected` com apenas `github_owned_allowed` -- action de
      # terceiro e barrada antes de o workflow rodar, e o sintoma e
      # `startup_failure` sem log. Conformar-se a politica e melhor que
      # afrouxa-la para caber uma ferramenta.
      #
      # `docker save` + `--input` em vez de montar /var/run/docker.sock: montar
      # o socket do Docker e dar root na pratica, que foi exatamente o motivo
      # de o `autoheal` ter sido recusado no VPS. Nao vale reabrir aqui.
      #
      # Imagem fixada por digest do indice multi-arquitetura, pelo mesmo motivo
      # que as actions sao fixadas por SHA.
      #
      # `--ignore-unfixed` de proposito: CVE de pacote de sistema sem correcao
      # publicada nao e acionavel. Reprovar por ele travaria PR sem relacao
      # nenhuma com o assunto e ensinaria a ignorar o vermelho.
      - name: Varredura de vulnerabilidade da imagem servida
        run: |
          set -euo pipefail
          docker save mega-sena:local -o "$RUNNER_TEMP/imagem.tar"
          docker run --rm \
            -v "$RUNNER_TEMP:/varredura:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /varredura/imagem.tar \
                  --scanners vuln \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 1 \
                  --format table
